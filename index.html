                    <label className="block text-[10px] font-bold text-slate-200 mb-1 font-heading">Reservation Date</label>
                    <input 
                      type="date" 
                      value={resDate} 
                      onChange={(e) => setResDate(e.target.value)} 
                      className="w-full px-3 py-2.5 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-white outline-none focus:border-[#FF7A00]" 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-200 mb-1 font-heading">Start Time</label>
                      <input 
                        type="time" 
                        value={resStartTime} 
                        onChange={(e) => setResStartTime(e.target.value)} 
                        className="w-full px-3 py-2.5 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-white outline-none focus:border-[#FF7A00]" 
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-slate-200 mb-1 font-heading">Finish Time</label>
                      <input 
                        type="time" 
                        value={resFinishTime} 
                        onChange={(e) => setResFinishTime(e.target.value)} 
                        className="w-full px-3 py-2.5 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-white outline-none focus:border-[#FF7A00]" 
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold text-slate-200 mb-1 font-heading">Contact Number</label>
                    <input 
                      type="text" 
                      value={resContact} 
                      onChange={(e) => setResContact(e.target.value)} 
                      placeholder="09123456789" 
                      className="w-full px-3 py-2.5 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-white placeholder-slate-500 outline-none focus:border-[#FF7A00]" 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2.5 pt-2">
                    <button 
                      type="button" 
                      onClick={() => setReservingCourt(null)} 
                      className="app-press py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      disabled={submittingRes} 
                      className="app-press py-2.5 bg-[#FF7A00] hover:bg-orange-500 text-slate-950 font-black font-heading rounded-xl text-xs shadow-lg disabled:opacity-50"
                    >
                      {submittingRes ? 'Submitting...' : 'Submit Request'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    function AdminDashboard({ currentUser, showNotification, adminTab }) {
      const [users, setUsers] = React.useState([]);
      const [applications, setApplications] = React.useState([]);
      const [logs, setLogs] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      const [courtName, setCourtName] = React.useState('');
      const [courtLocation, setCourtLocation] = React.useState('Ormoc City');
      const [courtPayment, setCourtPayment] = React.useState('₱500 per game');
      const [courtContact, setCourtContact] = React.useState('');
      const [submittingCourt, setSubmittingCourt] = React.useState(false);

      React.useEffect(() => {
        fetchAllAdminData();
      }, [adminTab]);

      const fetchAllAdminData = async () => {
        setLoading(true);
        try {
          const [usersRes, appsRes, logsRes] = await Promise.all([
            supabase.from('profiles').select('*').order('created_at', { ascending: false }),
            supabase.from('tournament_applications').select('*').order('submitted_at', { ascending: false }),
            supabase.from('audit_logs').select('*').order('created_at', { ascending: false })
          ]);

          if (usersRes.data) setUsers(usersRes.data);
          if (appsRes.data) setApplications(appsRes.data);
          if (logsRes.data) setLogs(logsRes.data);
        } catch (err) {}
        setLoading(false);
      };

      const handleUpdateRole = async (userId, newRole) => {
        const { error } = await supabase.from('profiles').update({ role: newRole }).eq('id', userId);
        if (error) {
          showNotification(`Role update failed: ${error.message}`, 'error');
        } else {
          showNotification(`User role updated to ${newRole}!`, 'success');
          await safeAuditLog(currentUser, 'UPDATE_USER_ROLE', { target_user_id: userId, new_role: newRole, timestamp: getFormattedDateTime() });
          fetchAllAdminData();
        }
      };

      const handleAdminApprove = async (appId, status) => {
        const { error } = await supabase.from('tournament_applications').update({ status }).eq('id', appId);
        if (error) {
          showNotification(`Action failed: ${error.message}`, 'error');
        } else {
          showNotification(`League proposal set to ${status}!`, 'success');
          await safeAuditLog(currentUser, 'ADMIN_APPROVE_LEAGUE', { app_id: appId, status, timestamp: getFormattedDateTime() });
          fetchAllAdminData();
        }
      };

      const handleAddCourtSubmit = async (e) => {
        e.preventDefault();
        if (!courtName.trim()) {
          showNotification('Court name is required.', 'error');
          return;
        }

        setSubmittingCourt(true);
        const formattedDateTime = getFormattedDateTime(getTodayDateForInput(), getCurrentTimeForInput());

        try {
          const { error } = await supabase.from('tournament_applications').insert([{
            user_id: currentUser.id && !currentUser.id.startsWith('demo-') ? currentUser.id : null,
            athlete_name: `COURT: ${courtName}`,
            contact_number: `Fee: ${courtPayment} | Contact: ${courtContact || 'N/A'}`,
            barangay: courtLocation,
            tournament_category: `Sports Facility — ${formattedDateTime}`,
            status: 'Approved'
          }]);

          if (error) {
            showNotification(`Failed to add court: ${error.message}`, 'error');
          } else {
            await safeAuditLog(currentUser, 'ADD_COURT', { courtName, courtLocation, courtPayment, courtContact, timestamp: formattedDateTime });
            showNotification(`Court "${courtName}" added successfully!`, 'success');
            setCourtName('');
            setCourtPayment('₱500 per game');
            setCourtContact('');
            fetchAllAdminData();
          }
        } catch (err) {
          showNotification('Error adding court.', 'error');
        } finally {
          setSubmittingCourt(false);
        }
      };

      const pendingLeagueProposals = applications.filter(a => a.status === 'Pending' && a.athlete_name && a.athlete_name.startsWith('LIGA:'));
      const processedLeagueProposals = applications.filter(a => (a.status === 'Approved' || a.status === 'Declined') && a.athlete_name && a.athlete_name.startsWith('LIGA:'));
      const pendingCount = pendingLeagueProposals.length;
      const approvedCount = applications.filter(a => a.status === 'Approved' && a.athlete_name && a.athlete_name.startsWith('LIGA:')).length;

      return (
        <div className="p-4 md:p-6 space-y-5 md:space-y-6 animate-pop-in">
          {loading ? (
            <LoadingSpinner label="Fetching system data..." />
          ) : (
            <>
              {adminTab === 'metrics' && (
                <div className="space-y-4 animate-pop-in">
                  <h3 className="text-xs font-bold font-heading text-white border-b border-[#FF7A00]/20 pb-2">
                    📊 League Metrics
                  </h3>

                  <div className="grid grid-cols-2 xl:grid-cols-4 gap-3">
                    <div className="p-3 bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-2xl text-center space-y-1 shadow-lg">
                      <p className="text-[10px] text-slate-400 font-heading">Total Accounts</p>
                      <p className="text-xl font-black font-mono text-[#FF7A00]">{users.length}</p>
                    </div>

                    <div className="p-3 bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-2xl text-center space-y-1 shadow-lg">
                      <p className="text-[10px] text-slate-400 font-heading">Pending Leagues</p>
                      <p className="text-xl font-black font-mono text-[#FFC700]">{pendingCount}</p>
                    </div>

                    <div className="p-3 bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-2xl text-center space-y-1 shadow-lg">
                      <p className="text-[10px] text-slate-400 font-heading">Approved Leagues</p>
                      <p className="text-xl font-black font-mono text-emerald-400">{approvedCount}</p>
                    </div>

                    <div className="p-3 bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-2xl text-center space-y-1 shadow-lg">
                      <p className="text-[10px] text-slate-400 font-heading">Security Audit Logs</p>
                      <p className="text-xl font-black font-mono text-cyan-400">{logs.length}</p>
                    </div>
                  </div>

                  <div className="space-y-2 pt-2">
                    <h4 className="text-[11px] font-bold font-heading text-slate-300">Approved & Declined Leagues</h4>
                    {processedLeagueProposals.length === 0 ? (
                      <p className="text-[11px] text-slate-400 py-4 text-center bg-[#13093B]/40 rounded-2xl border border-white/5">No processed league proposals yet.</p>
                    ) : (
                      <div className="space-y-2 max-h-[240px] md:max-h-none overflow-y-auto pr-1">
                        {processedLeagueProposals.map((app) => (
                          <div key={app.id} className="p-3 bg-[#13093B]/80 border border-[#FF7A00]/20 rounded-2xl flex items-center justify-between gap-2 shadow-sm">
                            <div className="space-y-0.5 truncate">
                              <p className="font-bold text-xs font-heading text-white truncate">{app.athlete_name}</p>
                              <p className="text-[10px] text-[#FF7A00] font-mono truncate">{app.tournament_category}</p>
                            </div>
                            <StatusBadge status={app.status} />
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {adminTab === 'add_court' && (
                <div className="space-y-4 bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-3xl p-5 shadow-xl animate-pop-in">
                  <div className="border-b border-[#FF7A00]/20 pb-2">
                    <h3 className="text-xs font-bold font-heading text-white">🏟️ Add Sports Court / Venue</h3>
                    <p className="text-[10px] text-slate-400">Register a new playing court for Ormoc tournaments</p>
                  </div>

                  <form onSubmit={handleAddCourtSubmit} className="space-y-3 text-xs">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-200 mb-1 font-heading">Court / Venue Name</label>
                      <input 
                        type="text" 
                        value={courtName} 
                        onChange={(e) => setCourtName(e.target.value)} 
                        placeholder="e.g., Ormoc City Gymnasium" 
                        className="w-full px-3 py-2.5 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-white outline-none focus:border-[#FF7A00]" 
                      />
                    </div>

                    <div>
                      <label className="block text-[10px] font-bold text-slate-200 mb-1 font-heading">Location / Barangay</label>
                      <input 
                        type="text" 
                        value={courtLocation} 
                        onChange={(e) => setCourtLocation(e.target.value)} 
                        placeholder="e.g., Brgy. Cogon, Ormoc City" 
                        className="w-full px-3 py-2.5 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-white outline-none focus:border-[#FF7A00]" 
                      />
                    </div>

                    <div>
                      <label className="block text-[10px] font-bold text-slate-200 mb-1 font-heading">Payment / Rental Fee</label>
                      <input 
                        type="text" 
                        value={courtPayment} 
                        onChange={(e) => setCourtPayment(e.target.value)} 
                        placeholder="e.g., ₱500 per game or Free" 
                        className="w-full px-3 py-2.5 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-white outline-none focus:border-[#FF7A00]" 
                      />
                    </div>

                    <div>
                      <label className="block text-[10px] font-bold text-slate-200 mb-1 font-heading">Contact Number</label>
                      <input 
                        type="text" 
                        value={courtContact} 
                        onChange={(e) => setCourtContact(e.target.value)} 
                        placeholder="e.g., 09123456789" 
                        className="w-full px-3 py-2.5 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-white outline-none focus:border-[#FF7A00]" 
                      />
                    </div>

                    <button 
                      type="submit" 
                      disabled={submittingCourt} 
                      className="app-press w-full py-3 bg-[#FF7A00] hover:bg-orange-500 text-slate-950 font-black font-heading rounded-xl text-xs shadow-lg disabled:opacity-50 mt-2"
                    >
                      {submittingCourt ? 'Adding Court...' : 'Add Court 🏟️'}
                    </button>
                  </form>
                </div>
              )}

              {adminTab === 'users' && (
                <div className="space-y-3 animate-pop-in">
                  <div className="flex justify-between items-center border-b border-[#FF7A00]/20 pb-2">
                    <h3 className="text-xs font-bold font-heading text-white">👥 User Accounts Management</h3>
                    <button onClick={fetchAllAdminData} className="app-press text-[10px] text-[#FF7A00] font-heading">Refresh</button>
                  </div>

                  <div className="space-y-2 max-h-[420px] md:max-h-none overflow-y-auto pr-1">
                    {users.map((u) => (
                      <div key={u.id} className="p-3 bg-[#13093B]/80 border border-[#FF7A00]/20 rounded-2xl space-y-2 text-xs shadow-sm">
                        <div className="flex justify-between items-start">
                          <div>
                            <p className="font-bold font-heading text-white">{u.full_name}</p>
                            <p className="text-[10px] text-slate-400 font-mono">@{u.username} • {u.email}</p>
                          </div>
                          <span className="px-2 py-0.5 bg-[#FF7A00]/20 text-[#FF7A00] font-bold text-[9px] rounded-full capitalize">
                            {u.role}
                          </span>
                        </div>

                        <div className="flex items-center gap-2 pt-1 border-t border-white/5">
                          <span className="text-[10px] text-slate-400">Change Role:</span>
                          <select
                            value={u.role}
                            onChange={(e) => handleUpdateRole(u.id, e.target.value)}
                            className="px-2 py-1 bg-[#0B032D] border border-[#FF7A00]/30 rounded-lg text-[10px] text-white outline-none"
                          >
                            <option value="athlete">Athlete</option>
                            <option value="organizer">Organizer</option>
                            <option value="admin">Admin</option>
                          </select>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {adminTab === 'approvals' && (
                <div className="space-y-3 animate-pop-in">
                  <div className="flex justify-between items-center border-b border-[#FF7A00]/20 pb-2">
                    <h3 className="text-xs font-bold font-heading text-white">⚡ League Approvals</h3>
                    <button onClick={fetchAllAdminData} className="app-press text-[10px] text-[#FF7A00] font-heading">Refresh</button>
                  </div>

                  {pendingLeagueProposals.length === 0 ? (
                    <p className="text-xs text-slate-400 py-16 text-center">No pending league proposals remaining.</p>
                  ) : (
                    <div className="space-y-2 max-h-[420px] md:max-h-none overflow-y-auto pr-1">
                      {pendingLeagueProposals.map((app) => (
                        <div key={app.id} className="p-3 bg-[#13093B]/80 border border-[#FF7A00]/20 rounded-2xl space-y-2 text-xs shadow-sm">
                          <div className="flex justify-between items-start">
                            <div>
                              <p className="font-bold font-heading text-white">{app.athlete_name}</p>
                              <p className="text-[10px] text-slate-400">{app.tournament_category}</p>
                              {app.contact_number && <p className="text-[10px] text-slate-300 mt-0.5">Details: {app.contact_number}</p>}
                            </div>
                            <StatusBadge status={app.status} />
                          </div>

                          <div className="grid grid-cols-2 gap-2 pt-1">
                            <button onClick={() => handleAdminApprove(app.id, 'Approved')} className="app-press py-1 bg-[#FF7A00] text-slate-950 font-bold font-heading rounded-xl text-[10px]">Approve</button>
                            <button onClick={() => handleAdminApprove(app.id, 'Declined')} className="app-press py-1 bg-red-600/20 text-red-300 border border-red-500/30 font-bold font-heading rounded-xl text-[10px]">Decline</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {adminTab === 'logs' && (
                <div className="space-y-3 animate-pop-in">
                  <div className="flex justify-between items-center border-b border-[#FF7A00]/20 pb-2">
                    <h3 className="text-xs font-bold font-heading text-white">🛡️ Municipal Audit Log Trail</h3>
                    <button onClick={fetchAllAdminData} className="app-press text-[10px] text-[#FF7A00] font-heading">Refresh</button>
                  </div>

                  <div className="space-y-2 max-h-[420px] md:max-h-none overflow-y-auto pr-1">
                    {logs.map((log) => (
                      <div key={log.id} className="p-2.5 bg-[#13093B]/80 border border-[#FF7A00]/20 rounded-xl space-y-1 font-mono text-[10px]">
                        <div className="flex justify-between text-slate-300">
                          <span>{new Date(log.created_at).toLocaleString()}</span>
                          <span className="text-[#FF7A00] font-bold">{log.action}</span>
                        </div>
                        <p className="text-white font-sans text-xs">{log.user_email || 'System User'}</p>
                        <p className="text-slate-400 text-[9px] truncate">{JSON.stringify(log.details)}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function App() {
      const [currentUser, setCurrentUser] = React.useState(null);
      const [activeNavTab, setActiveNavTab] = React.useState('metrics');
      const [notification, setNotification] = React.useState({ message: '', type: 'info' });
      const [showLogoutModal, setShowLogoutModal] = React.useState(false);
      const isStaffDashboard = currentUser && (currentUser.role === 'admin' || currentUser.role === 'organizer');

      React.useEffect(() => {
        document.body.classList.toggle('staff-dashboard', Boolean(isStaffDashboard));
        return () => document.body.classList.remove('staff-dashboard');
      }, [isStaffDashboard]);

      const showNotification = (message, type = 'info') => setNotification({ message, type });
      const clearNotification = () => setNotification({ message: '', type: 'info' });

      const handleConfirmLogout = async () => {
        if (currentUser) {
          await safeAuditLog(currentUser, 'USER_LOGOUT', { username: currentUser.username, timestamp: getFormattedDateTime() });
        }
        setCurrentUser(null);
        setShowLogoutModal(false);
        showNotification('Signed out of LigaDakbayan.', 'info');
      };

      return (
        <div className="flex flex-col h-full w-full justify-between overflow-hidden bg-[#0B032D] relative">
          <ConfirmModal isOpen={showLogoutModal} title="Confirm Logout" message="Are you sure you want to log out of LigaDakbayan?" confirmText="Logout" confirmStyle="danger" onConfirm={handleConfirmLogout} onCancel={() => setShowLogoutModal(false)} />

          {!currentUser ? (
            <div className="flex-1 flex flex-col justify-between overflow-y-auto">
              <SystemBanner notification={notification} onClose={clearNotification} />
              <AuthModule onAuthSuccess={(user) => {
                setCurrentUser(user);
                setActiveNavTab(user.role === 'admin' ? 'metrics' : 'main');
              }} showNotification={showNotification} />
              <footer className="py-3 text-center text-[10px] text-slate-400 font-mono">LigaDakbayan Ormoc &copy; 2026</footer>
            </div>
          ) : (
            <div className={`flex flex-col h-full min-h-0 justify-between relative ${isStaffDashboard ? 'md:flex-col' : ''}`}>
              <header className={`px-4 py-3 bg-[#13093B]/90 backdrop-blur-md border-b border-[#FF7A00]/30 flex items-center justify-between z-20 ${isStaffDashboard ? 'md:px-8 md:py-5 md:w-full' : ''}`}>
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-2xl bg-[#FF7A00]/20 border border-[#FF7A00]/40 text-[#FF7A00] flex items-center justify-center font-black font-heading text-xs shadow-inner">
                    {currentUser.full_name ? currentUser.full_name.charAt(0) : 'L'}
                  </div>
                  <div>
                    {isStaffDashboard && <p className="hidden md:block text-[10px] uppercase tracking-[0.2em] text-[#FF7A00] font-bold font-heading">LigaDakbayan • Ormoc City</p>}
                    <h2 className={`text-xs font-bold font-heading text-white leading-none ${isStaffDashboard ? 'md:text-sm mt-0.5' : ''}`}>{currentUser.full_name}</h2>
                    <p className="text-[10px] text-slate-300 capitalize mt-0.5">Role: <span className="text-[#FF7A00] font-bold font-heading">{currentUser.role}</span></p>
                  </div>
                </div>

                <button type="button" onClick={() => setShowLogoutModal(true)} className={`app-press px-3 py-1.5 bg-red-600/20 hover:bg-red-600/30 text-red-300 border border-red-500/30 rounded-xl text-[10px] font-bold font-heading ${isStaffDashboard ? 'md:px-4 md:py-2 md:text-xs' : ''}`}>
                  Logout
                </button>
              </header>

              <SystemBanner notification={notification} onClose={clearNotification} />

              <div className={`flex flex-col flex-1 min-h-0 ${isStaffDashboard ? 'md:flex-row' : ''}`}>
              <main className="flex-1 min-w-0 overflow-y-auto">
                {activeNavTab === 'zone' ? (
                  <OrmocZoneSchedule />
                ) : activeNavTab === 'athlete_leagues' ? (
                  <AthleteLeaguesView currentUser={currentUser} showNotification={showNotification} />
                ) : currentUser.role === 'admin' ? (
                  <AdminDashboard currentUser={currentUser} showNotification={showNotification} adminTab={activeNavTab} />
                ) : currentUser.role === 'organizer' ? (
                  <OrganizerDashboard 
                    currentUser={currentUser} 
                    showNotification={showNotification} 
                    activeNavTab={activeNavTab}
                    setActiveNavTab={setActiveNavTab}
                  />
                ) : (
                  <PlayerDashboard currentUser={currentUser} showNotification={showNotification} />
                )}
              </main>

              <nav className={`px-4 py-2.5 bg-[#13093B]/90 backdrop-blur-md border-t border-[#FF7A00]/30 flex items-center justify-around text-[10px] z-20 ${isStaffDashboard ? 'md:px-3 md:py-4 md:border-t-0 md:border-r md:border-[#FF7A00]/20 md:items-stretch md:justify-start md:gap-2 md:text-xs md:w-64 lg:w-72 md:flex-col md:shrink-0 md:order-first' : ''}`}>
                {isStaffDashboard && (
                  <>
                    <p className="hidden md:block px-3 mb-2 text-[10px] uppercase tracking-[0.2em] font-bold text-slate-500 font-heading">Workspace</p>
                    <div className="hidden md:block h-px bg-white/10 mb-2"></div>
                  </>
                )}

                <button onClick={() => setActiveNavTab(currentUser.role === 'admin' ? 'metrics' : 'main')} className={`app-press flex flex-col items-center gap-0.5 ${isStaffDashboard ? 'md:flex-row md:w-full md:items-center md:gap-3 md:px-3 md:py-3 md:rounded-xl md:text-left' : ''} ${(activeNavTab === 'main' || activeNavTab === 'metrics') ? 'text-[#FF7A00] font-bold font-heading md:bg-[#FF7A00]/10' : 'text-slate-400 hover:text-slate-200 md:hover:bg-white/5'}`}>
                  <span className="text-base">🏀</span>
                  <span>Dashboard</span>
                </button>

                {currentUser.role === 'admin' && (
                  <>
                    <button onClick={() => setActiveNavTab('add_court')} className={`app-press flex flex-col items-center gap-0.5 ${isStaffDashboard ? 'md:flex-row md:w-full md:items-center md:gap-3 md:px-3 md:py-3 md:rounded-xl md:text-left' : ''} ${activeNavTab === 'add_court' ? 'text-[#FF7A00] font-bold font-heading md:bg-[#FF7A00]/10' : 'text-slate-400 hover:text-slate-200 md:hover:bg-white/5'}`}>
                      <span className="text-base">🏟️</span>
                      <span>Add Court</span>
                    </button>

                    <button onClick={() => setActiveNavTab('users')} className={`app-press flex flex-col items-center gap-0.5 ${isStaffDashboard ? 'md:flex-row md:w-full md:items-center md:gap-3 md:px-3 md:py-3 md:rounded-xl md:text-left' : ''} ${activeNavTab === 'users' ? 'text-[#FF7A00] font-bold font-heading md:bg-[#FF7A00]/10' : 'text-slate-400 hover:text-slate-200 md:hover:bg-white/5'}`}>
                      <span className="text-base">👥</span>
                      <span>Users</span>
                    </button>

                    <button onClick={() => setActiveNavTab('approvals')} className={`app-press flex flex-col items-center gap-0.5 ${isStaffDashboard ? 'md:flex-row md:w-full md:items-center md:gap-3 md:px-3 md:py-3 md:rounded-xl md:text-left' : ''} ${activeNavTab === 'approvals' ? 'text-[#FF7A00] font-bold font-heading md:bg-[#FF7A00]/10' : 'text-slate-400 hover:text-slate-200 md:hover:bg-white/5'}`}>
                      <span className="text-base">⚡</span>
                      <span>Approvals</span>
                    </button>

                    <button onClick={() => setActiveNavTab('logs')} className={`app-press flex flex-col items-center gap-0.5 ${isStaffDashboard ? 'md:flex-row md:w-full md:items-center md:gap-3 md:px-3 md:py-3 md:rounded-xl md:text-left' : ''} ${activeNavTab === 'logs' ? 'text-[#FF7A00] font-bold font-heading md:bg-[#FF7A00]/10' : 'text-slate-400 hover:text-slate-200 md:hover:bg-white/5'}`}>
                      <span className="text-base">🛡️</span>
                      <span>Logs</span>
                    </button>
                  </>
                )}

                {currentUser.role === 'athlete' && (
                  <button onClick={() => setActiveNavTab('athlete_leagues')} className={`app-press flex flex-col items-center gap-0.5 ${isStaffDashboard ? 'md:flex-row md:w-full md:items-center md:gap-3 md:px-3 md:py-3 md:rounded-xl md:text-left' : ''} ${activeNavTab === 'athlete_leagues' ? 'text-[#FF7A00] font-bold font-heading md:bg-[#FF7A00]/10' : 'text-slate-400 hover:text-slate-200 md:hover:bg-white/5'}`}>
                    <span className="text-base">🏆</span>
                    <span>Leagues</span>
                  </button>
                )}

                {currentUser.role === 'organizer' && (
                  <>
                    <button onClick={() => setActiveNavTab('courts')} className={`app-press flex flex-col items-center gap-0.5 ${isStaffDashboard ? 'md:flex-row md:w-full md:items-center md:gap-3 md:px-3 md:py-3 md:rounded-xl md:text-left' : ''} ${activeNavTab === 'courts' ? 'text-[#FF7A00] font-bold font-heading md:bg-[#FF7A00]/10' : 'text-slate-400 hover:text-slate-200 md:hover:bg-white/5'}`}>
                      <span className="text-base">🏟️</span>
                      <span>Courts</span>
                    </button>

                    <button onClick={() => setActiveNavTab('liga')} className={`app-press flex flex-col items-center gap-0.5 ${isStaffDashboard ? 'md:flex-row md:w-full md:items-center md:gap-3 md:px-3 md:py-3 md:rounded-xl md:text-left' : ''} ${activeNavTab === 'liga' ? 'text-[#FF7A00] font-bold font-heading md:bg-[#FF7A00]/10' : 'text-slate-400 hover:text-slate-200 md:hover:bg-white/5'}`}>
                      <span className="text-base">🏆</span>
                      <span>Create League</span>
                    </button>
                  </>
                )}

                <button onClick={() => setActiveNavTab('zone')} className={`app-press flex flex-col items-center gap-0.5 ${isStaffDashboard ? 'md:flex-row md:w-full md:items-center md:gap-3 md:px-3 md:py-3 md:rounded-xl md:text-left' : ''} ${activeNavTab === 'zone' ? 'text-[#FF7A00] font-bold font-heading md:bg-[#FF7A00]/10' : 'text-slate-400 hover:text-slate-200 md:hover:bg-white/5'}`}>
                  <span className="text-base">📊</span>
                  <span>Live Brackets</span>
                </button>
              </nav>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
