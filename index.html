<!DOCTYPE html>
<html lang="en" class="h-full bg-[#07011D]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LigaDakbayan — Ormoc City Sports Tournament Management System</title>

  <!-- Google Fonts: Montserrat (Headings) & Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Native CSS Keyframe Animations & Picker Customizations -->
  <style>
    @keyframes appPopIn {
      0% { opacity: 0; transform: translateY(8px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    .animate-pop-in {
      animation: appPopIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-glow {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    /* Touch Feedback & Ripple Physics */
    .app-press {
      transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .app-press:active {
      transform: scale(0.92) !important;
      filter: brightness(1.2);
    }
    /* Force browser native date/time pickers to show clock/calendar icons clearly */
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(1) brightness(1.5);
      cursor: pointer;
      opacity: 0.8;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover,
    input[type="time"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }
    @media (min-width: 640px) {
      body.staff-dashboard {
        display: block;
        padding: 0;
      }
      body.staff-dashboard #root {
        width: 100%;
        max-width: none;
        height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel Standalone for inline JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="h-full text-slate-100 antialiased font-sans bg-[#07011D] flex items-center justify-center p-0 sm:p-4 select-none">

  <!-- Phone Shell Container with Ambient Glow -->
  <div id="root" class="w-full h-full sm:max-w-md sm:h-[844px] bg-[#0B032D] sm:border sm:border-white/10 sm:rounded-[48px] sm:shadow-[0_0_60px_rgba(255,122,0,0.2)] flex flex-col overflow-hidden relative"></div>

  <script type="text/babel">
    const SUPABASE_URL = "https://stmvtlitenuaszhyoupm.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0bXZ0bGl0ZW51YXN6aHlvdXBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTY4NTIsImV4cCI6MjEwNzI3Mjg1Mn0.zCiu-wqD7YyZf59WDGZnS_O4p2lD0n5sTsEUyWfolQ8";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const IAS_PASSWORD_REGEX = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

    const DEMO_ACCOUNTS = {
      'admin_ormoc': {
        id: 'demo-admin-id',
        username: 'admin_ormoc',
        password: 'Admin123!',
        full_name: 'LGU Sports Admin',
        email: 'admin@ormoc.gov.ph',
        role: 'admin'
      },
      'organizer_danhug': {
        id: 'demo-org-id',
        username: 'organizer_danhug',
        password: 'Organizer123!',
        full_name: 'Brgy Sports Committee',
        email: 'danhug@ormoc.gov.ph',
        role: 'organizer'
      },
      'occi_captain': {
        id: 'demo-athlete-id',
        username: 'occi_captain',
        password: 'Player123!',
        full_name: 'OCCI Team Captain',
        email: 'occi@gmail.com',
        role: 'athlete'
      }
    };

    const safeAuditLog = async (currentUser, action, details = {}) => {
      try {
        if (!currentUser) return;
        await supabase.from('audit_logs').insert({
          user_id: currentUser.id && !currentUser.id.startsWith('demo-') ? currentUser.id : null,
          user_email: currentUser.email || currentUser.username,
          user_role: currentUser.role,
          action: action,
          details: details
        });
      } catch (e) {}
    };

    const INITIAL_ORMOC_TEAMS = [
      { id: 1, name: 'OCCI Team', barangay: 'City Center', wins: 4, losses: 0, points: 8, status: 'Qualified (Rank 1)' },
      { id: 2, name: 'KNC Team', barangay: 'Brgy. San Jose', wins: 3, losses: 1, points: 7, status: 'Qualified (Rank 2)' },
      { id: 3, name: 'GP Collection', barangay: 'Brgy. Cogon', wins: 2, losses: 2, points: 6, status: 'Qualified (Rank 3)' },
    ];

    const INITIAL_BRACKETS = [
      {
        round: 'Semi-Final Matchup',
        matches: [
          { id: 'm1', team1: 'KNC Team', score1: 89, team2: 'GP Collection', score2: 84, status: 'FINAL', winner: 'KNC Team' },
        ]
      },
      {
        round: 'Championship Finals',
        matches: [
          { id: 'm2', team1: 'OCCI Team', score1: 78, team2: 'KNC Team', score2: 75, status: 'LIVE 4TH QTR', winner: null },
        ]
      }
    ];

    const getFormattedDateTime = (dateStr, timeStr) => {
      if (!dateStr) return new Date().toLocaleString();
      const combined = `${dateStr}T${timeStr || '08:00'}`;
      const now = new Date(combined);
      return now.toLocaleDateString('en-US', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });
    };

    const getTodayDateForInput = () => {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      return now.toISOString().slice(0, 10);
    };

    const getCurrentTimeForInput = () => {
      const now = new Date();
      return now.toTimeString().slice(0, 5);
    };

    function SystemBanner({ notification, onClose }) {
      if (!notification || !notification.message) return null;
      const isError = notification.type === 'error';
      const isSuccess = notification.type === 'success';

      return (
        <div className={`mx-4 my-2 p-3.5 rounded-2xl border backdrop-blur-xl flex items-start justify-between gap-3 text-xs font-medium shadow-2xl animate-pop-in ${
          isError ? 'bg-red-950/90 border-red-500/50 text-red-200' :
          isSuccess ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200' :
          'bg-[#13093B]/90 border-[#FF7A00]/40 text-slate-200'
        }`}>
          <div className="flex items-center gap-2.5">
            <span className="text-base">{isError ? '⚠️' : isSuccess ? '✅' : 'ℹ️'}</span>
            <div className="space-y-0.5">
              <p className="font-bold uppercase tracking-wider text-[9px] opacity-80 font-heading">
                {isError ? 'System Alert' : isSuccess ? 'Success' : 'Notice'}
              </p>
              <p className="text-xs leading-tight">{notification.message}</p>
            </div>
          </div>
          {onClose && (
            <button onClick={onClose} className="app-press text-slate-400 hover:text-white font-bold p-1 rounded-lg hover:bg-white/10" type="button">✕</button>
          )}
        </div>
      );
    }

    function ConfirmModal({ isOpen, title, message, confirmText, confirmStyle, onConfirm, onCancel }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-[#07011D]/80 backdrop-blur-md p-4 animate-pop-in">
          <div className="w-full max-w-xs bg-[#13093B]/95 border border-[#FF7A00]/40 rounded-3xl p-5 shadow-[0_10px_40px_rgba(0,0,0,0.8)] text-center space-y-4">
            <div className="w-12 h-12 bg-[#FF7A00]/10 border border-[#FF7A00]/30 rounded-2xl flex items-center justify-center mx-auto text-[#FF7A00] font-bold text-xl">🚨</div>
            <div className="space-y-1">
              <h3 className="text-base font-bold font-heading text-white">{title || 'Confirm Action'}</h3>
              <p className="text-xs text-slate-300 leading-relaxed">{message}</p>
            </div>
            <div className="grid grid-cols-2 gap-2.5 pt-2">
              <button onClick={onCancel} className="app-press py-2.5 px-3 bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
              <button onClick={onConfirm} className={`app-press py-2.5 px-3 rounded-xl text-xs font-bold font-heading shadow-lg ${confirmStyle === 'danger' ? 'bg-red-600 hover:bg-red-500 text-white' : 'bg-[#FF7A00] hover:bg-orange-500 text-slate-950'}`}>
                {confirmText || 'Confirm'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function LoadingSpinner({ label }) {
      return (
        <div className="flex flex-col items-center justify-center py-10 space-y-2 animate-pop-in">
          <div className="w-7 h-7 border-3 border-[#FF7A00]/20 border-t-[#FF7A00] rounded-full animate-spin"></div>
          {label && <p className="text-xs text-slate-300 font-medium">{label}</p>}
        </div>
      );
    }

    function StatusBadge({ status }) {
      const styles = {
        Pending: 'bg-amber-500/10 text-amber-300 border-amber-500/30',
        Approved: 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30',
        Declined: 'bg-red-500/10 text-red-300 border-red-500/30',
        Open: 'bg-blue-500/10 text-blue-300 border-blue-500/30'
      }[status] || 'bg-slate-800/80 text-slate-300 border-slate-700';

      return (
        <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-[9px] font-bold font-heading border ${styles}`}>
          {status}
        </span>
      );
    }

    function AuthModule({ onAuthSuccess, showNotification }) {
      const [activeTab, setActiveTab] = React.useState('login');
      const [loginUsername, setLoginUsername] = React.useState('occi_captain');
      const [loginPassword, setLoginPassword] = React.useState('Player123!');
      const [showLoginPassword, setShowLoginPassword] = React.useState(false);
      const [loginLoading, setLoginLoading] = React.useState(false);

      const [failedAttempts, setFailedAttempts] = React.useState(0);
      const [lockoutUntil, setLockoutUntil] = React.useState(null);
      const [remainingLockoutSecs, setRemainingLockoutSecs] = React.useState(0);

      const [regFullName, setRegFullName] = React.useState('');
      const [regEmail, setRegEmail] = React.useState('');
      const [regUsername, setRegUsername] = React.useState('');
      const [regRole, setRegRole] = React.useState('athlete');
      const [regPassword, setRegPassword] = React.useState('');
      const [regConfirmPassword, setRegConfirmPassword] = React.useState('');
      const [regLoading, setRegLoading] = React.useState(false);

      React.useEffect(() => {
        let timer = null;
        if (lockoutUntil) {
          timer = setInterval(() => {
            const now = Date.now();
            const diff = Math.ceil((lockoutUntil - now) / 1000);
            if (diff <= 0) {
              setLockoutUntil(null);
              setRemainingLockoutSecs(0);
              clearInterval(timer);
            } else {
              setRemainingLockoutSecs(diff);
            }
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [lockoutUntil]);

      const validations = {
        length: regPassword.length >= 8,
        uppercase: /[A-Z]/.test(regPassword),
        lowercase: /[a-z]/.test(regPassword),
        number: /\d/.test(regPassword),
        special: /[@$!%*?&]/.test(regPassword),
        match: regPassword.length > 0 && regPassword === regConfirmPassword,
      };

      const handleLoginSubmit = async (e) => {
        e.preventDefault();

        if (lockoutUntil && Date.now() < lockoutUntil) {
          showNotification(`Account locked due to 3 failed attempts. Try again in ${remainingLockoutSecs}s.`, 'error');
          return;
        }

        if (!loginUsername.trim() || !loginPassword) {
          showNotification('Username and password fields are required.', 'error');
          return;
        }

        setLoginLoading(true);

        try {
          const localAccount = DEMO_ACCOUNTS[loginUsername];
          if (localAccount && localAccount.password === loginPassword) {
            setFailedAttempts(0);
            setLockoutUntil(null);
            await safeAuditLog(localAccount, 'USER_LOGIN_SUCCESS', { username: localAccount.username, role: localAccount.role, timestamp: getFormattedDateTime() });
            showNotification(`Welcome back, ${localAccount.full_name}!`, 'success');
            onAuthSuccess(localAccount);
            setLoginLoading(false);
            return;
          }

          const { data, error } = await supabase
            .from('profiles')
            .select('*')
            .eq('username', loginUsername)
            .maybeSingle();

          if (error || !data || data.password !== loginPassword) {
            const newAttempts = failedAttempts + 1;
            setFailedAttempts(newAttempts);

            if (newAttempts >= 3) {
              const lockoutDuration = 30000 * (newAttempts - 2); 
              const lockTime = Date.now() + lockoutDuration;
              setLockoutUntil(lockTime);
              setRemainingLockoutSecs(Math.ceil(lockoutDuration / 1000));
              showNotification(`3 Failed Attempts! Account locked for ${Math.ceil(lockoutDuration / 1000)} seconds.`, 'error');
            } else {
              showNotification(`Invalid credentials. Attempt ${newAttempts}/3 before lockout.`, 'error');
            }
            setLoginLoading(false);
            return;
          }

          setFailedAttempts(0);
          setLockoutUntil(null);

          await safeAuditLog(data, 'USER_LOGIN_SUCCESS', { username: data.username, role: data.role, timestamp: getFormattedDateTime() });

          showNotification(`Welcome back, ${data.full_name}!`, 'success');
          onAuthSuccess(data);
        } catch (err) {
          showNotification('Authentication server error. Try again.', 'error');
        } finally {
          setLoginLoading(false);
        }
      };

      const handleRegisterSubmit = async (e) => {
        e.preventDefault();

        if (!regFullName.trim() || !regEmail.trim() || !regUsername.trim()) {
          showNotification('All registration fields are required.', 'error');
          return;
        }

        if (!IAS_PASSWORD_REGEX.test(regPassword)) {
          showNotification('Password must meet all IAS complexity rules.', 'error');
          return;
        }

        if (regPassword !== regConfirmPassword) {
          showNotification('Password confirmation does not match.', 'error');
          return;
        }

        setRegLoading(true);

        try {
          const { data, error } = await supabase
            .from('profiles')
            .insert([{
              full_name: regFullName,
              email: regEmail,
              username: regUsername,
              password: regPassword,
              role: regRole
            }])
            .select()
            .single();

          if (error) {
            showNotification('Username or Email already registered.', 'error');
          } else {
            await safeAuditLog(data, 'USER_REGISTER', { username: regUsername, role: regRole, timestamp: getFormattedDateTime() });
            showNotification('Account created successfully! Please sign in.', 'success');
            setActiveTab('login');
            setLoginUsername(regUsername);
          }
        } catch (err) {
          showNotification('Registration failed. Try again.', 'error');
        } finally {
          setRegLoading(false);
        }
      };

      return (
        <div className="p-5 flex-1 flex flex-col justify-center space-y-4 animate-pop-in relative">
          <div className="absolute top-1/4 left-1/2 -translate-x-1/2 w-56 h-56 bg-[#FF7A00]/20 rounded-full blur-3xl pointer-events-none animate-glow"></div>

          <div className="text-center space-y-1 relative z-10">
            <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#FF7A00]/10 border border-[#FF7A00]/30 text-[#FF7A00] font-black text-2xl shadow-[0_0_20px_rgba(255,122,0,0.2)] mb-1">
              🔥
            </div>
            <h1 className="text-2xl font-black font-heading tracking-tight text-white">Liga<span className="text-[#FF7A00]">Dakbayan</span></h1>
            <p className="text-[11px] text-slate-300 font-medium">Ormoc City Sports Management System</p>
          </div>

          <div className="grid grid-cols-2 p-1 bg-[#13093B]/80 backdrop-blur-md rounded-2xl border border-[#FF7A00]/20 relative z-10">
            <button type="button" onClick={() => setActiveTab('login')} className={`app-press py-2 text-xs font-extrabold font-heading rounded-xl ${activeTab === 'login' ? 'bg-[#FF7A00] text-slate-950 shadow-lg' : 'text-slate-300 hover:text-white'}`}>
              Sign In
            </button>
            <button type="button" onClick={() => setActiveTab('register')} className={`app-press py-2 text-xs font-extrabold font-heading rounded-xl ${activeTab === 'register' ? 'bg-[#FF7A00] text-slate-950 shadow-lg' : 'text-slate-300 hover:text-white'}`}>
              Sign Up
            </button>
          </div>

          {activeTab === 'login' && (
            <form onSubmit={handleLoginSubmit} className="space-y-3 relative z-10 animate-pop-in">
              {lockoutUntil && (
                <div className="p-3 bg-red-950/80 border border-red-500/50 rounded-xl text-[11px] text-red-200 text-center font-semibold animate-pulse">
                  🔒 Account Locked! Try again in <span className="font-mono text-sm font-bold">{remainingLockoutSecs}s</span>
                </div>
              )}

              <div>
                <label className="block text-[11px] font-bold text-slate-200 mb-1 font-heading">Username</label>
                <input 
                  type="text" 
                  disabled={!!lockoutUntil}
                  value={loginUsername} 
                  onChange={(e) => setLoginUsername(e.target.value)} 
                  placeholder="e.g., occi_captain" 
                  className="w-full px-3.5 py-2.5 bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-xl text-xs text-white placeholder-slate-500 outline-none focus:border-[#FF7A00] disabled:opacity-50" 
                />
              </div>

              <div>
                <label className="block text-[11px] font-bold text-slate-200 mb-1 font-heading">Password</label>
                <div className="relative">
                  <input 
                    type={showLoginPassword ? 'text' : 'password'} 
                    disabled={!!lockoutUntil}
                    value={loginPassword} 
                    onChange={(e) => setLoginPassword(e.target.value)} 
                    placeholder="••••••••" 
                    className="w-full pl-3.5 pr-12 py-2.5 bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-xl text-xs text-white placeholder-slate-500 outline-none focus:border-[#FF7A00] disabled:opacity-50" 
                  />
                  <button type="button" onClick={() => setShowLoginPassword(!showLoginPassword)} className="app-press absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 font-bold">
                    {showLoginPassword ? 'Hide' : 'Show'}
                  </button>
                </div>
              </div>

              <button 
                type="submit" 
                disabled={loginLoading || !!lockoutUntil} 
                className="app-press w-full py-3 bg-[#FF7A00] hover:bg-orange-500 text-slate-950 font-black font-heading text-xs rounded-xl shadow-[0_4px_20px_rgba(255,122,0,0.3)] disabled:opacity-50"
              >
                {loginLoading ? 'Authenticating...' : 'Sign In'}
              </button>
            </form>
          )}

          {activeTab === 'register' && (
            <form onSubmit={handleRegisterSubmit} className="space-y-2 max-h-[400px] overflow-y-auto pr-1 relative z-10 animate-pop-in">
              <div>
                <label className="block text-[10px] font-bold text-slate-200 mb-0.5 font-heading">Full Name</label>
                <input type="text" value={regFullName} onChange={(e) => setRegFullName(e.target.value)} placeholder="Juan Dela Cruz" className="w-full px-3 py-2 bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-xl text-xs text-white outline-none focus:border-[#FF7A00]" />
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-200 mb-0.5 font-heading">Email Address</label>
                <input type="email" value={regEmail} onChange={(e) => setRegEmail(e.target.value)} placeholder="juan@example.com" className="w-full px-3 py-2 bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-xl text-xs text-white outline-none focus:border-[#FF7A00]" />
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-200 mb-0.5 font-heading">Username</label>
                <input type="text" value={regUsername} onChange={(e) => setRegUsername(e.target.value)} placeholder="juan_athlete" className="w-full px-3 py-2 bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-xl text-xs text-white outline-none focus:border-[#FF7A00]" />
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-200 mb-0.5 font-heading">Account Role</label>
                <select value={regRole} onChange={(e) => setRegRole(e.target.value)} className="w-full px-3 py-2 bg-[#13093B] border border-[#FF7A00]/30 rounded-xl text-xs text-white outline-none">
                  <option value="athlete">Athlete / Player</option>
                  <option value="organizer">Barangay Sports Committee</option>
                  <option value="admin">LGU Sports Coordinator</option>
                </select>
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-200 mb-0.5 font-heading">Password</label>
                <input type="password" value={regPassword} onChange={(e) => setRegPassword(e.target.value)} placeholder="••••••••" className="w-full px-3 py-2 bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-xl text-xs text-white outline-none focus:border-[#FF7A00]" />
              </div>

              <div>
                <label className="block text-[10px] font-bold text-slate-200 mb-0.5 font-heading">Confirm Password</label>
                <input type="password" value={regConfirmPassword} onChange={(e) => setRegConfirmPassword(e.target.value)} placeholder="••••••••" className="w-full px-3 py-2 bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-xl text-xs text-white outline-none focus:border-[#FF7A00]" />
              </div>

              <div className="p-2 bg-[#13093B]/90 rounded-xl border border-[#FF7A00]/20 space-y-1 text-[10px]">
                <p className="font-bold text-slate-300 font-heading">Password Requirements:</p>
                <div className="grid grid-cols-2 gap-0.5 font-mono text-[9px] text-slate-400">
                  <span className={validations.length ? 'text-[#FF7A00] font-bold' : ''}>{validations.length ? '✓' : '•'} Min 8 chars</span>
                  <span className={validations.uppercase ? 'text-[#FF7A00] font-bold' : ''}>{validations.uppercase ? '✓' : '•'} Uppercase</span>
                  <span className={validations.lowercase ? 'text-[#FF7A00] font-bold' : ''}>{validations.lowercase ? '✓' : '•'} Lowercase</span>
                  <span className={validations.number ? 'text-[#FF7A00] font-bold' : ''}>{validations.number ? '✓' : '•'} Number</span>
                  <span className={validations.special ? 'text-[#FF7A00] font-bold' : ''}>{validations.special ? '✓' : '•'} Special (@$!%*?&)</span>
                  <span className={validations.match ? 'text-[#FF7A00] font-bold' : ''}>{validations.match ? '✓' : '•'} Match</span>
                </div>
              </div>

              <button type="submit" disabled={regLoading} className="app-press w-full py-2.5 bg-[#FF7A00] hover:bg-orange-500 text-slate-950 font-black font-heading text-xs rounded-xl shadow-[0_4px_20px_rgba(255,122,0,0.3)]">
                {regLoading ? 'Registering Account...' : 'Register Account'}
              </button>
            </form>
          )}
        </div>
      );
    }

              <span>🏆</span> Ormoc City Basketball Championship

                      <div className="space-y-1.5">

          {viewTab === 'standings' && (
            <div className="bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-3xl overflow-hidden shadow-xl animate-pop-in">
              <div className="p-3 bg-[#0B032D]/80 border-b border-[#FF7A00]/30 flex items-center justify-between">
                <span className="text-xs font-extrabold font-heading text-white">Ormoc League Leaderboard</span>
                <span className="text-[9px] bg-[#FFC700]/20 text-[#FFC700] px-2.5 py-0.5 rounded-full font-bold">Season 2026</span>
              </div>
              <div className="divide-y divide-[#FF7A00]/10 text-xs">
                {INITIAL_ORMOC_TEAMS.map((team, index) => (
                  <div key={team.id} className="p-3 flex items-center justify-between hover:bg-white/5 transition-colors">
                    <div className="flex items-center space-x-2.5">
                      <span className={`w-5 h-5 rounded-full flex items-center justify-center font-black text-[10px] ${index === 0 ? 'bg-[#FFC700] text-slate-950 shadow-[0_0_10px_rgba(255,199,0,0.5)]' : 'bg-[#0B032D] text-slate-300'}`}>
                        {index + 1}
                      </span>
                      <div>
                        <h4 className="font-bold font-heading text-white">{team.name}</h4>
                        <p className="text-[10px] text-slate-400">{team.barangay}</p>
                      </div>
                    </div>
                    <div className="text-right font-mono text-[11px]">
                      <span className="text-[#FF7A00] font-bold">{team.wins}W</span> - <span className="text-slate-400">{team.losses}L</span>
                      <span className="block text-[9px] text-emerald-400 font-sans font-semibold">{team.status}</span>

    function PlayerDashboard({ currentUser, showNotification }) {
      const [bookings, setBookings] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        fetchMyBookings();
      }, []);

      const fetchMyBookings = async () => {
        setLoading(true);

          .select('*')
          .eq('user_id', currentUser.id)
          .order('submitted_at', { ascending: false });

        if (!error) setBookings(data || []);
        setLoading(false);

      return (
        <div className="p-4 space-y-4 animate-pop-in">
          <div className="bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-3xl p-4 space-y-3 shadow-xl">
            <div className="flex justify-between items-center border-b border-[#FF7A00]/20 pb-2">
              <h3 className="text-xs font-bold font-heading text-white flex items-center gap-1.5">
                <span>📋</span> My Submitted Entries
              </h3>
              <button onClick={fetchMyBookings} className="app-press text-[10px] text-[#FF7A00] font-heading font-bold">Refresh</button>

              <div className="space-y-2 max-h-[420px] overflow-y-auto pr-1">
                {bookings.map((b) => (
                  <div key={b.id} className="p-3 bg-[#0B032D] border border-[#FF7A00]/20 rounded-2xl space-y-1.5 shadow-sm">
                    <div className="flex items-start justify-between gap-2">
                      <p className="font-bold text-xs font-heading text-white leading-tight">{b.athlete_name}</p>
                      <StatusBadge status={b.status} />
                    </div>
                    <div className="flex justify-between items-center text-[10px] text-[#FF7A00] font-mono">
                      <span className="truncate pr-2">{b.tournament_category}</span>
                      <span className="text-slate-300 font-bold shrink-0">{b.status}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function AthleteLeaguesView({ currentUser, showNotification }) {
      const [approvedLeagues, setApprovedLeagues] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [selectedLeague, setSelectedLeague] = React.useState(null);

      const [regType, setRegType] = React.useState('team'); // 'team' or 'solo'
      const [teamName, setTeamName] = React.useState('');
      const [captainName, setCaptainName] = React.useState(currentUser?.full_name || '');
      const [contactNum, setContactNum] = React.useState('');
      const [barangayName, setBarangayName] = React.useState('');
      const [paymentMethod, setPaymentMethod] = React.useState('GCash'); // 'GCash', 'Maya', 'Cash'
      const [paymentReference, setPaymentReference] = React.useState('');
      const [requirementFiles, setRequirementFiles] = React.useState([]);
      const [submitting, setSubmitting] = React.useState(false);

      // Camera Modal State
      const [showCameraModal, setShowCameraModal] = React.useState(false);
      const videoRef = React.useRef(null);
      const canvasRef = React.useRef(null);
      const [cameraStream, setCameraStream] = React.useState(null);

      // File / Photo Preview Modal State
      const [previewFile, setPreviewFile] = React.useState(null);

      React.useEffect(() => {
        fetchApprovedLeagues();
      }, []);

      const fetchApprovedLeagues = async () => {
        setLoading(true);
        const { data, error } = await supabase
          .from('tournament_applications')
          .select('*')
          .eq('status', 'Approved')
          .order('submitted_at', { ascending: false });

        if (!error && data) {
          setApprovedLeagues(data.filter(item => item.athlete_name && item.athlete_name.startsWith('LIGA:')));
        }
        setLoading(false);
      };

      const startCamera = async () => {
        setShowCameraModal(true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
          setCameraStream(stream);
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
          }
        } catch (err) {
          showNotification('Unable to access camera. Please check permissions.', 'error');
          setShowCameraModal(false);
        }
      };

      const stopCamera = () => {
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
          setCameraStream(null);
        }
        setShowCameraModal(false);
      };

      const capturePhoto = () => {
        if (!videoRef.current || !canvasRef.current) return;
        const video = videoRef.current;
        const canvas = canvasRef.current;
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob((blob) => {
          const file = new File([blob], `camera_capture_${Date.now()}.jpg`, { type: 'image/jpeg' });
          const previewUrl = URL.createObjectURL(blob);
          const fileWithPreview = Object.assign(file, { previewUrl });
          
          if (!window._appFilePreviews) window._appFilePreviews = {};
          window._appFilePreviews[file.name] = previewUrl;

          setRequirementFiles(prev => [...prev, fileWithPreview]);
          showNotification('Photo captured and attached!', 'success');
          stopCamera();
        }, 'image/jpeg', 0.9);
      };

      const handleFilesSelected = (e) => {
        const filesList = Array.from(e.target.files);
        if (filesList.length > 0) {
          const mappedFiles = filesList.map(file => {
            const previewUrl = file.type.startsWith('image/') ? URL.createObjectURL(file) : null;
            if (previewUrl) {
              if (!window._appFilePreviews) window._appFilePreviews = {};
              window._appFilePreviews[file.name] = previewUrl;
            }
            return Object.assign(file, { previewUrl });
          });
          setRequirementFiles(prev => [...prev, ...mappedFiles]);
          showNotification(`${filesList.length} file(s) attached successfully!`, 'success');
        }
      };

      const removeAttachedFile = (index) => {
        setRequirementFiles(prev => prev.filter((_, i) => i !== index));
      };

      const handleJoinSubmit = async (e) => {
        e.preventDefault();
        if (regType === 'team' && !teamName.trim()) {
          showNotification('Team Name is required for team rosters.', 'error');
          return;
        }
        if (!captainName.trim() || !contactNum.trim() || !barangayName.trim()) {
          showNotification('All required fields must be filled out.', 'error');
          return;
        }

        setSubmitting(true);
        try {
          const fileNamesStr = requirementFiles.length > 0 
            ? requirementFiles.map(f => f.name).join(', ') 
            : 'No files attached';

          const entryTitle = regType === 'team' 
            ? `Team: ${teamName} (Rep: ${captainName})` 
            : `Solo Athlete: ${captainName}`;

          const paymentInfo = `Pay: ${paymentMethod} (${paymentReference || 'N/A'})`;
          const contactWithPayment = `${contactNum} | ${paymentInfo} | Req: ${fileNamesStr}`;

          const { error } = await supabase.from('tournament_applications').insert([{
            user_id: currentUser.id && !currentUser.id.startsWith('demo-') ? currentUser.id : null,
            athlete_name: entryTitle,
            contact_number: contactWithPayment,
            barangay: barangayName,
            tournament_category: `${selectedLeague.athlete_name} — ${selectedLeague.tournament_category}`,
            status: 'Pending'
          }]);

          if (error) {
            showNotification(`Failed to join league: ${error.message}`, 'error');
          } else {
            await safeAuditLog(currentUser, 'JOIN_LEAGUE', { league: selectedLeague.athlete_name, type: regType, teamName: regType === 'team' ? teamName : 'Solo', paymentMethod, filesCount: requirementFiles.length, timestamp: getFormattedDateTime() });
            showNotification(`Successfully registered for ${selectedLeague.athlete_name}!`, 'success');
            setSelectedLeague(null);
            setTeamName('');
            setCaptainName(currentUser?.full_name || '');
            setContactNum('');
            setBarangayName('');
            setPaymentMethod('GCash');
            setPaymentReference('');
            setRequirementFiles([]);
            setRegType('team');
          }
        } catch (err) {
          showNotification('Error submitting registration.', 'error');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="p-4 space-y-4 animate-pop-in relative">
          <div className="text-center space-y-1 border-b border-[#FF7A00]/20 pb-3">
            <h3 className="text-xs font-black font-heading text-white uppercase tracking-wider flex items-center justify-center gap-1.5">
              <span>🏆</span> Approved Leagues & Tournaments
            </h3>
            <p className="text-[10px] text-slate-300">Browse and join leagues approved by Barangay Organizers</p>
          </div>

          {loading ? (
            <LoadingSpinner label="Loading approved leagues..." />
          ) : approvedLeagues.length === 0 ? (
            <p className="text-xs text-slate-400 py-16 text-center">No approved leagues available at the moment.</p>
          ) : (
            <div className="space-y-3 max-h-[460px] overflow-y-auto pr-1">
              {approvedLeagues.map((league) => {
                const cleanFee = league.contact_number ? league.contact_number.replace(/^(Contact \/ Fee:|Contact:|Fee:)\s*/i, '') : '';
                return (
                  <div key={league.id} className="p-4 bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-3xl space-y-3 shadow-xl">
                    <div className="flex items-start justify-between gap-2">
                      <h4 className="font-bold font-heading text-white text-xs leading-tight">{league.athlete_name}</h4>
                      <StatusBadge status={league.status} />
                    </div>
                    <p className="text-[11px] text-[#FF7A00] font-semibold">{league.tournament_category}</p>
                    <div className="flex items-center justify-between pt-1 border-t border-white/5">
                      <span className="text-[10px] text-slate-300 font-mono">Fee: {cleanFee || 'Free'}</span>
                      <button 
                        onClick={() => setSelectedLeague(league)} 
                        className="app-press px-4 py-2 bg-[#FF7A00] hover:bg-orange-500 text-slate-950 font-black font-heading text-[10px] rounded-xl shadow-md"
                      >
                        Join League 🚀
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* JOIN LEAGUE REGISTRATION MODAL FORM */}
          {selectedLeague && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-[#07011D]/85 backdrop-blur-md p-4 animate-pop-in">
              <div className="w-full max-w-sm bg-[#13093B] border border-[#FF7A00]/50 rounded-3xl p-5 shadow-[0_10px_40px_rgba(0,0,0,0.9)] space-y-3 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-start border-b border-[#FF7A00]/20 pb-2">
                  <div>
                    <h3 className="text-xs font-black font-heading text-white uppercase">League Registration Form</h3>
                    <p className="text-[10px] text-[#FF7A00] font-mono truncate mt-0.5">{selectedLeague.athlete_name}</p>
                  </div>
                  <button onClick={() => setSelectedLeague(null)} className="app-press text-slate-400 hover:text-white font-bold p-1 rounded-lg">✕</button>
                </div>

                <form onSubmit={handleJoinSubmit} className="space-y-2.5 text-xs">
                  <div>
                    <label className="block text-[10px] font-bold text-slate-200 mb-0.5 font-heading">Registration Type</label>
                    <div className="grid grid-cols-2 p-1 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-[10px] font-heading font-extrabold">
                      <button type="button" onClick={() => setRegType('team')} className={`app-press py-1.5 rounded-lg ${regType === 'team' ? 'bg-[#FF7A00] text-slate-950 shadow-md' : 'text-slate-300'}`}>
                        👥 Team Roster
                      </button>
                      <button type="button" onClick={() => setRegType('solo')} className={`app-press py-1.5 rounded-lg ${regType === 'solo' ? 'bg-[#FF7A00] text-slate-950 shadow-md' : 'text-slate-300'}`}>
                        👤 Solo Athlete
                      </button>
                    </div>
                  </div>

                  {regType === 'team' && (
                    <div>
                      <label className="block text-[10px] font-bold text-slate-200 mb-0.5 font-heading">Team Name</label>
                      <input 
                        type="text" 
                        value={teamName} 
                        onChange={(e) => setTeamName(e.target.value)} 
                        placeholder="e.g., Ormoc Ballers" 
                        className="w-full px-3 py-2 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-white outline-none focus:border-[#FF7A00]" 
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-[10px] font-bold text-slate-200 mb-0.5 font-heading">
                      {regType === 'team' ? 'Team Captain / Representative Name' : 'Athlete Full Name'}
                    </label>
                    <input 
                      type="text" 
                      value={captainName} 
                      onChange={(e) => setCaptainName(e.target.value)} 
                      placeholder="Juan Dela Cruz" 
                      className="w-full px-3 py-2 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-white outline-none focus:border-[#FF7A00]" 
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold text-slate-200 mb-0.5 font-heading">Contact Number</label>
                    <input 
                      type="text" 
                      value={contactNum} 
                      onChange={(e) => setContactNum(e.target.value)} 
                      placeholder="09123456789" 
                      className="w-full px-3 py-2 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-white outline-none focus:border-[#FF7A00]" 
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold text-slate-200 mb-0.5 font-heading">Barangay Origin</label>
                    <input 
                      type="text" 
                      value={barangayName} 
                      onChange={(e) => setBarangayName(e.target.value)} 
                      placeholder="e.g., Brgy. Cogon" 
                      className="w-full px-3 py-2 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-white placeholder-slate-500 outline-none focus:border-[#FF7A00]" 
                    />
                  </div>

                  {/* PAYMENT METHOD SECTION */}
                  <div className="space-y-1.5 pt-1 border-t border-white/5">
                    <label className="block text-[10px] font-bold text-slate-200 font-heading">Payment Method & Reference</label>
                    <div className="grid grid-cols-3 gap-1.5">
                      <button type="button" onClick={() => setPaymentMethod('GCash')} className={`app-press py-1.5 px-2 rounded-xl text-[10px] font-bold font-heading border ${paymentMethod === 'GCash' ? 'bg-[#FF7A00] text-slate-950 border-[#FF7A00] shadow-md' : 'bg-[#0B032D] text-slate-300 border-[#FF7A00]/30'}`}>
                        📱 GCash
                      </button>
                      <button type="button" onClick={() => setPaymentMethod('Maya')} className={`app-press py-1.5 px-2 rounded-xl text-[10px] font-bold font-heading border ${paymentMethod === 'Maya' ? 'bg-[#FF7A00] text-slate-950 border-[#FF7A00] shadow-md' : 'bg-[#0B032D] text-slate-300 border-[#FF7A00]/30'}`}>
                        💳 Maya
                      </button>
                      <button type="button" onClick={() => setPaymentMethod('Cash')} className={`app-press py-1.5 px-2 rounded-xl text-[10px] font-bold font-heading border ${paymentMethod === 'Cash' ? 'bg-[#FF7A00] text-slate-950 border-[#FF7A00] shadow-md' : 'bg-[#0B032D] text-slate-300 border-[#FF7A00]/30'}`}>
                        💵 Cash on Site
                      </button>
                    </div>
                    {paymentMethod !== 'Cash' && (
                      <input 
                        type="text" 
                        value={paymentReference} 
                        onChange={(e) => setPaymentReference(e.target.value)} 
                        placeholder="Enter Ref No. or Account Name" 
                        className="w-full px-3 py-2 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-white placeholder-slate-500 outline-none focus:border-[#FF7A00] mt-1" 
                      />
                    )}
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold text-slate-200 mb-0.5 font-heading">Requirements / Proof of Eligibility (Multiple Files / Photos)</label>
                    <div className="grid grid-cols-2 gap-2">
                      <label className="app-press flex items-center justify-center gap-1.5 px-3 py-2.5 bg-[#0B032D] hover:bg-[#FF7A00]/10 border border-[#FF7A00]/40 rounded-xl text-[10px] font-bold font-heading text-slate-200 cursor-pointer shadow-sm">
                        <span>📁</span> Add Files
                        <input 
                          type="file" 
                          multiple 
                          accept="image/*,.pdf" 
                          onChange={handleFilesSelected} 
                          className="hidden" 
                        />
                      </label>
                      <button 
                        type="button"
                        onClick={startCamera}
                        className="app-press flex items-center justify-center gap-1.5 px-3 py-2.5 bg-[#0B032D] hover:bg-[#FF7A00]/10 border border-[#FF7A00]/40 rounded-xl text-[10px] font-bold font-heading text-slate-200 cursor-pointer shadow-sm"
                      >
                        <span>📷</span> Take Photo
                      </button>
                    </div>

                    {requirementFiles.length > 0 && (
                      <div className="mt-2 space-y-1 max-h-28 overflow-y-auto pr-1 bg-[#0B032D]/80 p-2 rounded-xl border border-[#FF7A00]/20">
                        <p className="text-[9px] font-bold text-[#FF7A00] font-heading">Attached Items ({requirementFiles.length}) - Click to View:</p>
                        {requirementFiles.map((file, idx) => (
                          <div key={idx} className="flex items-center justify-between text-[10px] text-slate-300 bg-white/5 px-2 py-1.5 rounded-lg">
                            <button type="button" onClick={() => setPreviewFile({ name: file.name, previewUrl: file.previewUrl })} className="app-press truncate pr-2 font-mono text-left hover:text-[#FF7A00] flex items-center gap-1.5">
                              <span>📎</span> <span className="underline truncate">{file.name}</span>
                            </button>
                            <button type="button" onClick={() => removeAttachedFile(idx)} className="app-press text-red-400 hover:text-red-300 font-bold px-1.5 shrink-0">✕</button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-2 gap-2.5 pt-1">
                    <button 
                      type="button" 
                      onClick={() => setSelectedLeague(null)} 
                      className="app-press py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      disabled={submitting} 
                      className="app-press py-2.5 bg-[#FF7A00] hover:bg-orange-500 text-slate-950 font-black font-heading rounded-xl text-xs shadow-lg disabled:opacity-50"
                    >
                      {submitting ? 'Submitting...' : 'Submit Entry'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* LIVE CAMERA VIEWFINDER MODAL */}
          {showCameraModal && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-[#07011D]/90 backdrop-blur-lg p-4 animate-pop-in">
              <div className="w-full max-w-sm bg-[#13093B] border border-[#FF7A00]/60 rounded-3xl p-5 shadow-[0_10px_50px_rgba(0,0,0,0.9)] space-y-4 text-center">
                <div className="flex justify-between items-center border-b border-[#FF7A00]/20 pb-2">
                  <h3 className="text-xs font-black font-heading text-white uppercase">Live Camera Capture</h3>
                  <button onClick={stopCamera} className="app-press text-slate-400 hover:text-white font-bold p-1 rounded-lg">✕</button>
                </div>

                <div className="relative w-full aspect-[4/3] bg-black rounded-2xl overflow-hidden border border-[#FF7A00]/30 shadow-inner flex items-center justify-center">
                  <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover"></video>
                  <canvas ref={canvasRef} className="hidden"></canvas>
                </div>

                <div className="grid grid-cols-2 gap-2.5 pt-1">
                  <button 
                    type="button" 
                    onClick={stopCamera} 
                    className="app-press py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs"
                  >
                    Cancel
                  </button>
                  <button 
                    type="button" 
                    onClick={capturePhoto} 
                    className="app-press py-2.5 bg-[#FF7A00] hover:bg-orange-500 text-slate-950 font-black font-heading rounded-xl text-xs shadow-lg"
                  >
                    Capture Photo 📸
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FILE / PHOTO PREVIEW MODAL */}
          {previewFile && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center bg-[#07011D]/90 backdrop-blur-md p-4 animate-pop-in">
              <div className="w-full max-w-sm bg-[#13093B] border border-[#FF7A00]/60 rounded-3xl p-5 shadow-[0_10px_50px_rgba(0,0,0,0.9)] space-y-4 text-center">
                <div className="flex justify-between items-center border-b border-[#FF7A00]/20 pb-2">
                  <h3 className="text-xs font-black font-heading text-white uppercase truncate pr-2">File Preview</h3>
                  <button onClick={() => setPreviewFile(null)} className="app-press text-slate-400 hover:text-white font-bold p-1 rounded-lg">✕</button>
                </div>

                <div className="w-full max-h-[50vh] bg-[#0B032D] rounded-2xl border border-[#FF7A00]/30 p-3 flex items-center justify-center overflow-hidden">
                  {previewFile.previewUrl ? (
                    <img src={previewFile.previewUrl} alt="Preview" className="max-h-[45vh] w-auto rounded-xl object-contain shadow-md" />
                  ) : (
                    <div className="py-6 space-y-2">
                      <div className="w-48 h-36 bg-gradient-to-br from-[#FF7A00]/30 to-[#13093B] border border-[#FF7A00]/40 rounded-xl mx-auto flex flex-col items-center justify-center shadow-inner p-3">
                        <span className="text-2xl mb-1">🪪</span>
                        <p className="text-[10px] text-white font-bold font-heading">Ormoc Sports ID / Eligibility Proof</p>
                        <p className="text-[9px] text-[#FF7A00] font-mono mt-1">Verified Document</p>
                      </div>
                    </div>
                  )}
                </div>

                <p className="text-[11px] font-mono text-[#FF7A00] truncate">{previewFile.name}</p>

                <button 
                  type="button" 
                  onClick={() => setPreviewFile(null)} 
                  className="app-press w-full py-2.5 bg-[#FF7A00] hover:bg-orange-500 text-slate-950 font-black font-heading rounded-xl text-xs shadow-lg"
                >
                  Close Preview
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function OrganizerDashboard({ 
      currentUser, 
      showNotification, 
      activeNavTab,
      setActiveNavTab
    }) {
      const [ligaTitle, setLigaTitle] = React.useState('');
      const [ligaCategory, setLigaCategory] = React.useState('Basketball Men Open');
      const [ligaLocation, setLigaLocation] = React.useState('Ormoc Superdome');
      const [ligaFee, setLigaFee] = React.useState('₱500 per team');
      const [ligaDate, setLigaDate] = React.useState(getTodayDateForInput());
      const [ligaTime, setLigaTime] = React.useState(getCurrentTimeForInput());

      const [proposals, setProposals] = React.useState([]);
      const [playerRequests, setPlayerRequests] = React.useState([]);
      const [approvedCourts, setApprovedCourts] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      // Detailed View Modal for Team Registration Request
      const [inspectingRequest, setInspectingRequest] = React.useState(null);

      // File Preview Modal for Organizer Inspection
      const [inspectPreviewFile, setInspectPreviewFile] = React.useState(null);

      // Court Reservation Form Modal State
      const [reservingCourt, setReservingCourt] = React.useState(null);
      const [resDate, setResDate] = React.useState(getTodayDateForInput());
      const [resStartTime, setResStartTime] = React.useState('08:00');
      const [resFinishTime, setResFinishTime] = React.useState('12:00');
      const [resContact, setResContact] = React.useState('');
      const [submittingRes, setSubmittingRes] = React.useState(false);

      React.useEffect(() => {
        fetchApplications();
      }, []);

      const fetchApplications = async () => {
        setLoading(true);
        const { data } = await supabase
          .from('tournament_applications')
          .select('*')
          .order('submitted_at', { ascending: false });

        if (data) {
          setPlayerRequests(data.filter(item => 
            item.user_id !== currentUser.id && 
            !item.athlete_name.startsWith('COURT:') && 
            !item.athlete_name.startsWith('LIGA:')
          ));
          setProposals(data.filter(item => item.user_id === currentUser.id));
          setApprovedCourts(data.filter(item => item.athlete_name && item.athlete_name.startsWith('COURT:') && item.status === 'Approved'));
        }
        setLoading(false);
      };

      const handleCreateLiga = async (e) => {
        e.preventDefault();
        if (!ligaTitle.trim()) {
          showNotification('Tournament / Liga Title is required.', 'error');
          return;
        }

        const formattedDateTime = getFormattedDateTime(ligaDate, ligaTime);

        try {
          await supabase.from('tournament_applications').insert([{
            user_id: currentUser.id && !currentUser.id.startsWith('demo-') ? currentUser.id : null,
            athlete_name: `LIGA: ${ligaTitle}`,
            contact_number: `Fee: ${ligaFee}`,
            barangay: 'Brgy. Danhug',
            tournament_category: `${ligaCategory} @ ${ligaLocation} (${formattedDateTime})`,
            status: 'Pending'
          }]);
        } catch (e) {}

        await safeAuditLog(currentUser, 'PROPOSE_LIGA', { ligaTitle, ligaCategory, timestamp: formattedDateTime });
        showNotification(`Tournament proposal "${ligaTitle}" submitted for Admin approval!`, 'success');
        setLigaTitle('');
        setActiveNavTab('main');
        fetchApplications();
      };

      const handleOpenReserveModal = (court) => {
        setReservingCourt(court);
        setResDate(getTodayDateForInput());
        setResStartTime('08:00');
        setResFinishTime('12:00');
        setResContact('');
      };

      const handleReserveCourtSubmit = async (e) => {
        e.preventDefault();
        if (!resContact.trim() || !resDate || !resStartTime || !resFinishTime) {
          showNotification('All reservation fields are required.', 'error');
          return;
        }

        const courtNameClean = reservingCourt.athlete_name.replace(/^COURT:\s*/i, '');
        const scheduleDetails = `Date: ${resDate} | Time: ${resStartTime} - ${resFinishTime}`;

        setSubmittingRes(true);
        try {
          await supabase.from('tournament_applications').insert([{
            user_id: currentUser.id && !currentUser.id.startsWith('demo-') ? currentUser.id : null,
            athlete_name: `RESERVATION: ${courtNameClean}`,
            contact_number: resContact,
            barangay: reservingCourt.barangay,
            tournament_category: `${scheduleDetails} (${currentUser.full_name})`,
            status: 'Pending'
          }]);

          showNotification(`Reservation request for "${courtNameClean}" submitted as Pending!`, 'success');
          await safeAuditLog(currentUser, 'RESERVE_COURT', { court: courtNameClean, schedule: scheduleDetails, contact: resContact, timestamp: getFormattedDateTime() });
          setReservingCourt(null);
          fetchApplications();
        } catch (err) {
          showNotification('Failed to submit court reservation.', 'error');
        } finally {
          setSubmittingRes(false);
        }
      };

      const handleOrganizerApprove = async (id, status) => {
        const { error } = await supabase
          .from('tournament_applications')
          .update({ status: status })
          .eq('id', id);

        if (error) {
          showNotification(`Action failed: ${error.message}`, 'error');
        } else {
          showNotification(`Roster registration ${status} successfully!`, 'success');
          await safeAuditLog(currentUser, 'ORGANIZER_APPROVAL', { application_id: id, status: status, timestamp: getFormattedDateTime() });
          setInspectingRequest(null);
          fetchApplications();
        }
      };

      return (
        <div className="p-4 md:p-6 space-y-4 md:space-y-6 animate-pop-in relative">
          {activeNavTab === 'main' && (
            <div className="space-y-4 md:space-y-6 lg:grid lg:grid-cols-2 lg:gap-6 lg:space-y-0 animate-pop-in">
              <div className="bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-3xl p-4 space-y-3 shadow-xl">
                <div className="flex justify-between items-center border-b border-[#FF7A00]/20 pb-2">
                  <h3 className="text-xs font-bold font-heading text-white flex items-center gap-1.5">
                    <span>⚡</span> Team Registration Requests (Click to View)
                  </h3>
                  <button onClick={fetchApplications} className="app-press text-[10px] text-[#FF7A00] font-heading font-bold">Refresh</button>
                </div>

                {loading ? (
                  <LoadingSpinner label="Fetching verification requests..." />
                ) : playerRequests.length === 0 ? (
                  <p className="text-xs text-slate-400 py-6 text-center">No pending team registrations for verification.</p>
                ) : (
                  <div className="space-y-2 max-h-[220px] md:max-h-none overflow-y-auto pr-1">
                    {playerRequests.map((req) => (
                      <div 
                        key={req.id} 
                        onClick={() => setInspectingRequest(req)}
                        className="app-press p-3 bg-[#0B032D] border border-[#FF7A00]/20 hover:border-[#FF7A00] rounded-2xl space-y-2 shadow-sm cursor-pointer transition-all"
                      >
                        <div className="flex justify-between items-start">
                          <div>
                            <p className="font-bold text-xs font-heading text-white">{req.athlete_name}</p>
                            <p className="text-[10px] text-slate-300">Contact/Payment info available</p>
                          </div>
                          <StatusBadge status={req.status} />
                        </div>

                        <p className="text-xs font-bold text-[#FF7A00]">{req.tournament_category}</p>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-3xl p-4 space-y-3 shadow-xl">
                <h3 className="text-xs font-extrabold font-heading text-white flex items-center gap-1.5 border-b border-[#FF7A00]/20 pb-2">
                  <span>📋</span> Submitted Proposals (League & Courts)
                </h3>

                <div className="space-y-2 max-h-[220px] md:max-h-none overflow-y-auto pr-1">
                  {proposals.map((item) => (
                    <div key={item.id} className="p-3 bg-[#0B032D] border border-[#FF7A00]/20 rounded-2xl flex items-center justify-between gap-2 shadow-sm hover:border-[#FF7A00]/50 transition-all">
                      <div className="space-y-0.5 truncate">
                        <p className="font-bold text-xs font-heading text-white truncate leading-tight">
                          {item.athlete_name}
                        </p>
                        <p className="text-[10px] text-[#FF7A00] font-mono truncate">
                          {item.tournament_category}
                        </p>
                      </div>
                      <StatusBadge status={item.status} />
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* INSPECT REGISTRATION REQUEST MODAL */}
          {inspectingRequest && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-[#07011D]/85 backdrop-blur-md p-4 animate-pop-in">
              <div className="w-full max-w-sm bg-[#13093B] border border-[#FF7A00]/60 rounded-3xl p-5 shadow-[0_10px_50px_rgba(0,0,0,0.9)] space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-start border-b border-[#FF7A00]/20 pb-2.5">
                  <div>
                    <h3 className="text-xs font-black font-heading text-white uppercase">Registration Information</h3>
                    <p className="text-[10px] text-[#FF7A00] font-mono truncate mt-0.5">{inspectingRequest.athlete_name}</p>
                  </div>
                  <button onClick={() => setInspectingRequest(null)} className="app-press text-slate-400 hover:text-white font-bold p-1 rounded-lg">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="p-3 bg-[#0B032D] rounded-2xl border border-white/5 space-y-2">
                    <div>
                      <span className="text-[10px] text-slate-400 block font-heading font-bold">Tournament / League:</span>
                      <p className="text-white font-semibold">{inspectingRequest.tournament_category}</p>
                    </div>

                    <div>
                      <span className="text-[10px] text-slate-400 block font-heading font-bold">Barangay Origin:</span>
                      <p className="text-white font-semibold">{inspectingRequest.barangay || 'Not specified'}</p>
                    </div>

                    <div>
                      <span className="text-[10px] text-slate-400 block font-heading font-bold">Contact & Payment Details:</span>
                      <p className="text-[#FF7A00] font-mono text-[11px] bg-black/30 p-2 rounded-xl mt-1 leading-relaxed">
                        {inspectingRequest.contact_number || 'No details provided'}
                      </p>
                    </div>

                    {/* DEDICATED ATTACHED REQUIREMENT FILES VIEWER SECTION */}
                    {inspectingRequest.contact_number && inspectingRequest.contact_number.includes('Req:') && (
                      <div className="pt-1.5 border-t border-white/5">
                        <span className="text-[10px] text-slate-300 block font-heading font-bold mb-1.5">Attached Requirement Files:</span>
                        <div className="space-y-1">
                          {inspectingRequest.contact_number.split('Req:')[1]?.trim().split(',').map((fileName, fIdx) => {
                            const trimmedName = fileName.trim();
                            if (!trimmedName || trimmedName === 'No files attached') return <span key={fIdx} className="text-[10px] text-slate-400">None</span>;
                            return (
                              <button 
                                key={fIdx}
                                type="button"
                                onClick={() => setInspectPreviewFile(trimmedName)}
                                className="app-press w-full flex items-center justify-between text-[10px] text-[#FF7A00] font-mono bg-white/5 hover:bg-[#FF7A00]/20 px-2.5 py-2 rounded-xl border border-[#FF7A00]/30 transition-all"
                              >
                                <span className="flex items-center gap-1.5 truncate">
                                  <span>📎</span> <span className="underline truncate font-bold">{trimmedName}</span>
                                </span>
                                <span className="text-[9px] bg-[#FF7A00] text-slate-950 font-heading font-black px-2 py-0.5 rounded-full">View 👁️</span>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    <div>
                      <span className="text-[10px] text-slate-400 block font-heading font-bold mt-2">Status:</span>
                      <div className="mt-1"><StatusBadge status={inspectingRequest.status} /></div>
                    </div>
                  </div>

                  {inspectingRequest.status === 'Pending' && (
                    <div className="grid grid-cols-2 gap-2.5 pt-2">
                      <button 
                        onClick={() => handleOrganizerApprove(inspectingRequest.id, 'Approved')} 
                        className="app-press py-2.5 bg-[#FF7A00] hover:bg-orange-500 text-slate-950 font-black font-heading rounded-xl text-xs shadow-lg"
                      >
                        Approve Roster ✅
                      </button>
                      <button 
                        onClick={() => handleOrganizerApprove(inspectingRequest.id, 'Declined')} 
                        className="app-press py-2.5 bg-red-600/20 hover:bg-red-600/30 text-red-300 border border-red-500/35 font-bold font-heading rounded-xl text-xs"
                      >
                        Decline ❌
                      </button>
                    </div>
                  )}

                  <button 
                    type="button" 
                    onClick={() => setInspectingRequest(null)} 
                    className="app-press w-full py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs"
                  >
                    Close Window
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* INSPECT FILE PREVIEW MODAL */}
          {inspectPreviewFile && (
            <div className="fixed inset-0 z-[80] flex items-center justify-center bg-[#07011D]/90 backdrop-blur-md p-4 animate-pop-in">
              <div className="w-full max-w-sm bg-[#13093B] border border-[#FF7A00]/60 rounded-3xl p-5 shadow-[0_10px_50px_rgba(0,0,0,0.9)] space-y-4 text-center">
                <div className="flex justify-between items-center border-b border-[#FF7A00]/20 pb-2">
                  <h3 className="text-xs font-black font-heading text-white uppercase truncate pr-2">File Preview</h3>
                  <button onClick={() => setInspectPreviewFile(null)} className="app-press text-slate-400 hover:text-white font-bold p-1 rounded-lg">✕</button>
                </div>

                <div className="w-full max-h-[50vh] bg-[#0B032D] rounded-2xl border border-[#FF7A00]/30 p-3 flex items-center justify-center overflow-hidden">
                  {window._appFilePreviews && window._appFilePreviews[inspectPreviewFile] ? (
                    <img src={window._appFilePreviews[inspectPreviewFile]} alt="Preview" className="max-h-[45vh] w-auto rounded-xl object-contain shadow-md" />
                  ) : (
                    <div className="py-4 space-y-2">
                      <div className="w-56 h-40 bg-gradient-to-br from-[#FF7A00]/20 via-[#13093B] to-slate-900 border border-[#FF7A00]/40 rounded-xl mx-auto flex flex-col items-center justify-center shadow-inner p-4 space-y-2">
                        <span className="text-3xl">📷</span>
                        <p className="text-[11px] text-white font-bold font-heading">Participant Verification Photo</p>
                        <p className="text-[9px] text-[#FF7A00] font-mono truncate max-w-[200px]">{inspectPreviewFile}</p>
                      </div>
                    </div>
                  )}
                </div>

                <p className="text-[11px] font-mono text-[#FF7A00] truncate">{inspectPreviewFile}</p>

                <button 
                  type="button" 
                  onClick={() => setInspectPreviewFile(null)} 
                  className="app-press w-full py-2.5 bg-[#FF7A00] hover:bg-orange-500 text-slate-950 font-black font-heading rounded-xl text-xs shadow-lg"
                >
                  Close Preview
                </button>
              </div>
            </div>
          )}

          {activeNavTab === 'courts' && (
            <div className="bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-3xl p-4 space-y-3 shadow-xl animate-pop-in">
              <div className="flex justify-between items-center border-b border-[#FF7A00]/20 pb-2">
                <h3 className="text-xs font-bold font-heading text-white flex items-center gap-1.5">
                  <span>🏟️</span> Available Sports Courts for Reservation
                </h3>
                <button onClick={fetchApplications} className="app-press text-[10px] text-[#FF7A00] font-heading font-bold">Refresh</button>
              </div>

              {loading ? (
                <LoadingSpinner label="Loading courts..." />
              ) : approvedCourts.length === 0 ? (
                <p className="text-xs text-slate-400 py-10 text-center">No approved courts available yet.</p>
              ) : (
                <div className="space-y-3 max-h-[440px] overflow-y-auto pr-1">
                  {approvedCourts.map((court) => {
                    const cleanName = court.athlete_name.replace(/^COURT:\s*/i, '');
                    return (
                      <div key={court.id} className="p-4 bg-[#0B032D] border border-[#FF7A00]/30 rounded-2xl space-y-2 shadow-md">
                        <div className="flex justify-between items-start">
                          <div>
                            <h4 className="font-bold font-heading text-white text-xs">{cleanName}</h4>
                            <p className="text-[10px] text-slate-300">Location: {court.barangay}</p>
                          </div>
                          <span className="px-2 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-full font-bold text-[9px]">Available</span>
                        </div>
                        <p className="text-[10px] text-[#FF7A00] font-mono">{court.contact_number}</p>
                        <div className="pt-1 flex justify-end">
                          <button 
                            onClick={() => handleOpenReserveModal(court)} 
                            className="app-press px-4 py-2 bg-[#FF7A00] hover:bg-orange-500 text-slate-950 font-black font-heading text-[10px] rounded-xl shadow-lg"
                          >
                            Reserve Court 🏟️
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {activeNavTab === 'liga' && (
            <div className="bg-[#13093B]/80 border border-[#FF7A00]/30 rounded-3xl p-4 space-y-3 shadow-xl animate-pop-in">
              <div className="space-y-0.5 border-b border-[#FF7A00]/20 pb-2">
                <h3 className="text-xs font-extrabold font-heading text-white flex items-center gap-1.5">
                  <span>🏆</span> Create a Tournament / League
                </h3>
              </div>

              <form onSubmit={handleCreateLiga} className="space-y-2.5">
                <div>
                  <label className="block text-[10px] font-bold text-slate-200 mb-1 font-heading">League / Tournament</label>
                  <input
                    type="text"
                    value={ligaTitle}
                    onChange={(e) => setLigaTitle(e.target.value)}
                    placeholder="e.g., 2026 Barangay Cogon Summer League"
                    className="w-full px-3 py-2 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-xs text-white placeholder-slate-500 outline-none focus:border-[#FF7A00]"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-[10px] font-bold text-slate-200 mb-1 font-heading">Category</label>
                    <select
                      value={ligaCategory}
                      onChange={(e) => setLigaCategory(e.target.value)}
                      className="w-full px-2 py-2 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-xs text-white outline-none"
                    >
                      <option value="Basketball Men">Basketball Men</option>
                      <option value="Basketball Women">Basketball Women</option>
                      <option value="Volleyball Women">Volleyball Women</option>
                      <option value="Volleyball Men">Volleyball Men</option>
                      <option value="Badminton Mixed Doubles">Badminton Mixed Doubles</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-slate-200 mb-1 font-heading">Entry Fee</label>
                    <input
                      type="text"
                      value={ligaFee}
                      onChange={(e) => setLigaFee(e.target.value)}
                      placeholder="e.g., ₱500 per team"
                      className="w-full px-2.5 py-2 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-xs text-white outline-none focus:border-[#FF7A00]"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-[10px] font-bold text-slate-200 mb-1 font-heading">Venue / Location</label>
                  <input
                    type="text"
                    value={ligaLocation}
                    onChange={(e) => setLigaLocation(e.target.value)}
                    placeholder="e.g., Ormoc Superdome"
                    className="w-full px-3 py-2 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-xs text-white placeholder-slate-500 outline-none focus:border-[#FF7A00]"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-[10px] font-bold text-slate-200 mb-1 font-heading">Date</label>
                    <input
                      type="date"
                      value={ligaDate}
                      onChange={(e) => setLigaDate(e.target.value)}
                      className="w-full px-3 py-2 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-xs text-white outline-none focus:border-[#FF7A00]"
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-slate-200 mb-1 font-heading">Time</label>
                    <input
                      type="time"
                      value={ligaTime}
                      onChange={(e) => setLigaTime(e.target.value)}
                      className="w-full px-3 py-2 bg-[#0B032D] border border-[#FF7A00]/30 rounded-xl text-xs text-white outline-none focus:border-[#FF7A00]"
                    />
                  </div>
                </div>

                <button
                  type="submit"
                  className="app-press w-full py-2.5 bg-[#FF7A00] hover:bg-orange-500 text-slate-950 font-black font-heading text-xs rounded-xl shadow-md mt-2"
                >
                  Submit
                </button>
              </form>
            </div>
          )}

          {/* COURT RESERVATION MODAL FORM */}
          {reservingCourt && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-[#07011D]/85 backdrop-blur-md p-4 animate-pop-in">
              <div className="w-full max-w-sm bg-[#13093B] border border-[#FF7A00]/50 rounded-3xl p-5 shadow-[0_10px_40px_rgba(0,0,0,0.9)] space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-start border-b border-[#FF7A00]/20 pb-2.5">
                  <div>
                    <h3 className="text-xs font-black font-heading text-white uppercase">Reserve Sports Court</h3>
                    <p className="text-[10px] text-[#FF7A00] font-mono truncate mt-0.5">{reservingCourt.athlete_name.replace(/^COURT:\s*/i, '')}</p>
                  </div>
                  <button onClick={() => setReservingCourt(null)} className="app-press text-slate-400 hover:text-white font-bold p-1 rounded-lg">✕</button>
                </div>

                <form onSubmit={handleReserveCourtSubmit} className="space-y-3 text-xs">
                  <div>
